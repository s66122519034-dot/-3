<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sphere</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <p><a href="../index.html">Back to all shapes</a></p>

    <header class="block">
        <h1>Sphere</h1>
        <p>A sphere is a completely round 3D shape. Every point on its surface is the same distance from its center.</p>
        <p>The radius (r) is the distance from the center to the surface. A ball is an example of a sphere.</p>
    </header>

    <main>
        <div class="block photo-block">
            <img src="asset/example.svg" alt="Ball">
            <p>Ball</p>
        </div>

        <div class="block diagram-block">
            <h2>Sphere Volume</h2>
            <img src="asset/formula.svg" alt="V = (4 × π × r³) / 3">
            <p>V = (4 × π × r³) / 3</p>
        </div>

        <div class="block">
            <h2>Volume Calculator</h2>
            <form id="volumeCalculator">
                <p><label for="inRadius">Radius:</label>
                   <input type="number" id="inRadius" step="any" required></p>
                <p><label for="inUnit">Unit:</label>
                   <select id="inUnit">
                       <option value="cm">cm</option>
                       <option value="mm">mm</option>
                   </select></p>
                <button type="submit">Calculate</button>
            </form>
            <p id="result"></p>
        </div>
    </main>
</div>
<script src="script.js"></script>
</body>
</html>
