<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square Pyramid</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <p><a href="../index.html">Back to all shapes</a></p>

    <header class="block">
        <h1>Square Pyramid</h1>
        <p>A square pyramid has a square base and four triangular side faces that meet at one point.</p>
        <p>The base side length is (s). The height (h) is the vertical distance from the base to the top point.</p>
    </header>

    <main>
        <div class="block photo-block">
            <img src="asset/example.svg" alt="Pyramid">
            <p>Pyramid</p>
        </div>

        <div class="block diagram-block">
            <h2>Square Pyramid Volume</h2>
            <img src="asset/formula.svg" alt="V = (s² × h) / 3">
            <p>V = (s² × h) / 3</p>
        </div>

        <div class="block">
            <h2>Volume Calculator</h2>
            <form id="volumeCalculator">
                <p><label for="inSide">Base side:</label>
                   <input type="number" id="inSide" step="any" required></p>
                <p><label for="inHeight">Height:</label>
                   <input type="number" id="inHeight" step="any" required></p>
                <p><label for="inUnit">Unit:</label>
                   <select id="inUnit">
                       <option value="cm">cm</option>
                       <option value="mm">mm</option>
                   </select></p>
                <button type="submit">Calculate</button>
            </form>
            <p id="result"></p>
        </div>
    </main>
</div>
<script src="script.js"></script>
</body>
</html>
